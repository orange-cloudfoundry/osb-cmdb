{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osb-cmdb-go.fullname" . }}
  labels:
    {{- include "osb-cmdb-go.labels" . | nindent 4 }}
type: Opaque
data:
  broker-username: {{ .Values.broker.username | b64enc | quote }}
  broker-password: {{ .Values.broker.password | b64enc | quote }}
  cf-username: {{ .Values.cf.username | b64enc | quote }}
  cf-password: {{ .Values.cf.password | b64enc | quote }}
  {{- if .Values.cf.clientId }}
  cf-client-id: {{ .Values.cf.clientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.cf.clientSecret }}
  cf-client-secret: {{ .Values.cf.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
