# Default values for osb-cmdb-go.

replicaCount: 1

image:
  repository: ghcr.io/orange-cloudfoundry/osb-cmdb-go
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Broker configuration
broker:
  # Broker authentication
  username: admin
  password: ""  # Required: set via --set or values file

# Cloud Foundry configuration
cf:
  # CF API endpoint (required)
  apiHost: ""
  # CF authentication
  username: ""
  password: ""
  clientId: ""
  clientSecret: ""
  # Default org and space for backing services
  defaultOrg: ""
  defaultSpace: ""
  # Skip SSL validation (not recommended for production)
  skipSslValidation: false

# Catalog configuration
catalog:
  # Interval for periodic catalog refresh
  refreshInterval: "5m"
  # Suffix to add to service names
  serviceSuffix: ""
  # List of service name patterns to exclude
  excludedServices: []

# Feature flags
features:
  # Propagate OSB context as metadata
  propagateMetadata: true

# Logging
logging:
  level: info

# Use an existing secret for sensitive values
# If set, the chart will not create a secret
existingSecret: ""

# Health probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
