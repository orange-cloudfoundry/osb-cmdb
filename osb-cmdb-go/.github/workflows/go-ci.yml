name: Go CI

on:
  push:
    branches: [main]
    paths:
      - 'osb-cmdb-go/**'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'osb-cmdb-go/**'
      - '.github/workflows/go-ci.yml'

defaults:
  run:
    working-directory: osb-cmdb-go

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: osb-cmdb-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: osb-cmdb-go/coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: osb-cmdb-go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: osb-cmdb-go

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: osb-cmdb-go
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/osb-cmdb-go

      - name: Template Helm chart
        run: |
          helm template test deploy/helm/osb-cmdb-go \
            --set broker.password=test \
            --set cf.apiHost=https://api.cf.example.com \
            --set cf.username=admin \
            --set cf.password=password \
            --set cf.defaultOrg=test-org \
            --set cf.defaultSpace=test-space
